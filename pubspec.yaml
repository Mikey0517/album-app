name: album_app
description: A warm, calm LAN family album.
publish_to: "none"
version: 1.2.66+70

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  # 直接用 CacheManager/Config 给图片缓存配上限；版本与 cached_network_image 的传递依赖一致。
  flutter_cache_manager: ^3.4.1
  video_player: ^2.9.2
  chewie: ^1.8.5
  intl: ^0.19.0
  connectivity_plus: 6.0.5
  image_picker: ^1.1.2
  share_plus: 7.2.2
  image_picker_android: ^0.8.12+21
  image_picker_platform_interface: ^2.10.1
  uuid: ^4.5.1
  package_info_plus: ^8.1.0
  path_provider: ^2.1.4
  gal: 2.2.3
  crypto: ^3.0.5
  open_filex: ^4.5.0
  video_thumbnail: ^0.5.3

  # 固定 wakelock_plus，避免其 1.3+ 传递依赖 package_info_plus 9.x：
  # 后者的 Android Gradle 脚本要求比 Flutter 3.24 更新的插件 API。
  wakelock_plus: 1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/changelog.md
    - assets/brand_mark.png
