name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  ios-build:
    name: Build iOS (unsigned)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: CocoaPods
        run: |
          cd ios
          pod install --repo-update
      - name: Build (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r AlbumApp-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AlbumApp-unsigned-ipa
          path: build/ios/iphoneos/AlbumApp-unsigned.ipa
          if-no-files-found: error
