name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  ios-build:
    name: Build iOS (unsigned)
    # macos-13 已下线；macos-14/15 默认 arm64（公共库可用），私有库免费额度只能 Intel 镜像。
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Toolchain info
        run: |
          flutter --version
          xcodebuild -version
          xcode-select -p
          ls /Applications | grep -i xcode || true
      - name: Flutter pub get
        run: flutter pub get
      - name: CocoaPods
        run: |
          cd ios
          pod install --repo-update
      - name: Build (no codesign)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee "${RUNNER_TEMP}/build.log"
      - name: Report build log on failure
        if: failure()
        run: |
          LOG="${RUNNER_TEMP}/build.log"
          [ -f "$LOG" ] || exit 0
          { echo "### iOS build failed"; echo '```'; tail -c 6000 "$LOG"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          python3 - "$LOG" <<'PY'
          import sys
          data = open(sys.argv[1], "rb").read()[-5000:].decode("utf-8", "replace")
          esc = data.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error::" + esc)
          PY
      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r AlbumApp-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AlbumApp-unsigned-ipa
          path: build/ios/iphoneos/AlbumApp-unsigned.ipa
          if-no-files-found: error
